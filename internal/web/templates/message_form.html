{% extends "base.html" %}
{% block content %}
<div class="page-context"><a href="/messages?environment={{ active_environment }}">← 定时消息</a><span>{{ active_environment }}</span></div>
<section class="section-header"><div><h1>创建消息</h1><p>选择 Topic，填写消息内容和投递时间。同一 Topic 的 Unique ID 重复时返回原消息，不覆盖。</p></div></section>
{% if error %}<div class="alert">{{ error }}</div>{% endif %}
{% if not topics %}<div class="note">当前环境还没有 Topic，请先<a href="/topics/new?environment={{ active_environment }}">创建 Topic</a>。</div>{% endif %}
<form class="form panel" method="post" action="/messages">
<input type="hidden" name="environment" value="{{ active_environment }}">
<div class="grid two"><label>Topic<select name="topic" required>{% for topic in topics %}<option value="{{ topic.name }}" {% if topic.name == selected_topic %}selected{% endif %}>{{ topic.name }}</option>{% endfor %}</select></label>
<label>Unique ID<input name="uniqueId" required value="{{ unique_id }}" maxlength="160"></label>
<label>投递时间（带时区）<input name="runAt" required value="{{ run_at }}" placeholder="2026-09-25T10:00:00+08:00"></label></div>
<label>Payload<textarea class="broker-json" name="payload" required>{{ payload if payload else '{}' }}</textarea></label>
<div class="page-actions"><button class="primary" {% if not topics %}disabled{% endif %}>创建消息</button><a class="button" href="/messages?environment={{ active_environment }}">取消</a></div></form>
{% endblock %}
